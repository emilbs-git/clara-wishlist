Her er koden, hvor den eneste tekst er "Clara" centreret på skærmen, skrevet med mørkerød skrift på en fersken/lyserød baggrund.
Gem koden som index.html:
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffd8be; /* Fersken/lyserød */
            color: #800000; /* Mørkerød */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <h1>Clara</h1>

</body>
</html>
